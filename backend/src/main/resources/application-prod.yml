spring:
  datasource:
    # DB_PATH should point at a mounted persistent Volume (see PROJECT.md section 9).
    url: jdbc:h2:file:${DB_PATH:./data/festival};DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false

logging:
  level:
    com.festival.order: INFO
